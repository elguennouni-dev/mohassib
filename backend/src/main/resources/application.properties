spring.application.name=mohassib

# ── Server ──
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# ── Database ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Files ──
mohassib.files.directory=${FILES_DIR:./storage}

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── JWT ──
mohassib.jwt.secret=${JWT_SECRET}
mohassib.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:60}
mohassib.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
mohassib.jwt.issuer=mohassib

# ── CORS ──
mohassib.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── SMTP (Zoho) ──
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mohassib.mail.from-name=${MAIL_FROM_NAME:Mohassib}

# ── Google OAuth ──
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:email,profile}

# ── Logging ──
logging.level.org.hibernate.SQL=INFO
logging.level.com.elguennouni.mohassib=DEBUG
