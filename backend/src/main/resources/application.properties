spring.application.name=mohassib

# Every secret must come from .env (local dev) or the Compose env_file (prod).
# Structural settings (port, paths, profiles) keep safe defaults.

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# Database (no defaults — startup fails fast if missing)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
mohassib.jwt.secret=${JWT_SECRET}
mohassib.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:60}
mohassib.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
mohassib.jwt.issuer=mohassib

# CORS
mohassib.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Frontend base URL (used by the OAuth2 success handler to redirect back to the SPA)
mohassib.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Honor X-Forwarded-* headers behind the nginx reverse proxy in production
server.forward-headers-strategy=framework

# File storage
mohassib.files.directory=${FILES_DIR:./storage}

# Actuator (only health is exposed, used by the Docker HEALTHCHECK)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.com.elguennouni.mohassib=DEBUG

# Mail
spring.mail.host=${MAIL_HOST:smtp.zoho.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Google OAuth (no defaults — secrets must come from env)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:email,profile}

# Payroll (cross-check brackets with the DGI before launch)
mohassib.payroll.cnss-rate=${PAYROLL_CNSS_RATE:0.0448}
mohassib.payroll.cnss-ceiling=${PAYROLL_CNSS_CEILING:6000}
mohassib.payroll.ir-brackets=${PAYROLL_IR_BRACKETS:0:0,2500:0.10,8333:0.20,17500:0.30,30000:0.34}
