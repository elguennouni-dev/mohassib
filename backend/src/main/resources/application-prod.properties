# Production profile. Activated by SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile).
# All secrets come from the environment (docker-compose .env passthrough).

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.elguennouni.mohassib=INFO

# Force-fail startup if these are missing — no dev defaults in prod.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
mohassib.jwt.secret=${JWT_SECRET}
mohassib.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
