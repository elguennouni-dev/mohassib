# Edge reverse proxy: TLS termination + SPA + /api proxy.
# TLS certs are mounted from the host at /etc/letsencrypt (read-only).
# When certs aren't present yet (first boot), the 443 server block fails to
# start gracefully — only the HTTP block is needed for the certbot challenge.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health endpoint used by the container HEALTHCHECK and reverse-proxy probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt http-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mohassib.elguennouni.site;

    ssl_certificate     /etc/letsencrypt/live/mohassib.elguennouni.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mohassib.elguennouni.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Edge security headers (backend also sets these — harmless duplication).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API. `backend` is the Compose service name on the internal network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Long-cache for hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
